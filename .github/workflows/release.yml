# v* タグを push すると、protoviz イメージ (amd64/arm64) と Helm チャートを ghcr.io に公開する
#   イメージ: ghcr.io/<owner>/protoviz:<version>
#   チャート: oci://ghcr.io/<owner>/charts/protoviz
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      - name: Check tag matches Chart.yaml
        id: ver
        run: |
          app=$(sed -n 's/^appVersion: "\(.*\)"/\1/p' chart/protoviz/Chart.yaml)
          chart=$(sed -n 's/^version: //p' chart/protoviz/Chart.yaml)
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$chart" ] || [ "$tag" != "$app" ]; then
            echo "::error::tag v$tag does not match Chart.yaml (version=$chart, appVersion=$app)"; exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.ver.outputs.owner }}/protoviz:${{ steps.ver.outputs.version }}
            ghcr.io/${{ steps.ver.outputs.owner }}/protoviz:latest

      - name: Push Helm chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package chart/protoviz -d dist/
          helm push dist/protoviz-${{ steps.ver.outputs.version }}.tgz oci://ghcr.io/${{ steps.ver.outputs.owner }}/charts
