name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: azure/setup-helm@v5
      - name: パケットの長さ・チェックサム・DER 構造を検証
        run: make check
      - run: helm lint chart/protoviz
      - run: helm template protoviz chart/protoviz > /dev/null
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
